networks:
  cloud-net:
    name: cloud-net

services:

  monitoring-node-exporter-server:
    image: prom/node-exporter:latest
    container_name: monitoring-node-exporter-server
    ports:
      - "9100:9100"
    restart: unless-stopped
    networks:
      - cloud-net


  monitoring-prometheus-server:
    build:
      context: ./monitoring-prometheus-server
      dockerfile: Dockerfile
    image: mini-cloud-prometheus:v1
    container_name: monitoring-prometheus-server
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - cloud-net


  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring-grafana-dashboard-server/loki-config.yml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped
    networks:
      - cloud-net

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./monitoring-grafana-dashboard-server/promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    restart: unless-stopped
    networks:
      - cloud-net

  monitoring-grafana-dashboard-server:
    image: grafana/grafana:latest
    container_name: monitoring-grafana-dashboard-server
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./monitoring-grafana-dashboard-server/provisioning:/etc/grafana/provisioning:ro
    restart: unless-stopped
    networks:
      - cloud-net

  redis-cache-server:
    image: redis:7-alpine
    container_name: redis-cache-server
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - cloud-net

  # --- Vân: App + Proxy (+ Web stub tạm cho S2) ---
  application-backend-server:
    build:
      context: ./application-backend-server
      dockerfile: Dockerfile
    image: minicloud-app:dev
    container_name: application-backend-server
    ports:
      - "8085:8081"
    environment:
      - PORT=8081
      # Khi Lợi gắn DB vào compose, mở 2 dòng dưới để /rooms đọc Postgres:
      # - POSTGRES_HOST=relational-database-server
      # - POSTGRES_PORT=5432
      # - POSTGRES_USER=minicloud
      # - POSTGRES_PASSWORD=minicloud_dev
      # - POSTGRES_DB=minicloud
    restart: unless-stopped
    networks:
      - cloud-net

  web-frontend-server:
    build:
      context: ./web-frontend-server
      dockerfile: Dockerfile
    image: minicloud-web:stub
    container_name: web-frontend-server
    ports:
      - "8080:80"
    restart: unless-stopped
    networks:
      - cloud-net

  api-gateway-proxy-server:
    build:
      context: ./api-gateway-proxy-server
      dockerfile: Dockerfile
    image: minicloud-proxy:dev
    container_name: api-gateway-proxy-server
    ports:
      - "80:80"
    depends_on:
      - application-backend-server
      - web-frontend-server
    restart: unless-stopped
    networks:
      - cloud-net
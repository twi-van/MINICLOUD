events {}

http {
  # Docker DNS — dùng cho Web/Auth (có thể chưa có container)
  resolver 127.0.0.11 valid=10s ipv6=off;

  # LB Round Robin — ≥ 2 NestJS (Sprint 3)
  upstream app_backend {
    server application-backend-server-1:8081;
    server application-backend-server-2:8081;
  }

  # Đề: Round Robin 2 web server
  upstream web_frontend {
    server web-frontend-server:80;
    server web-frontend-server-2:80;
  }

  server {
    listen 80;

    # ── Cách A: mỗi API một location riêng (route mở rộng tường minh) ──

    # GET /api/hello → App /hello
    location = /api/hello {
      proxy_pass http://app_backend/hello;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # B1 — GET /api/metrics → App /metrics (Prometheus text)
    location = /api/metrics {
      proxy_pass http://app_backend/metrics;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # GET /api/student → App /student
    location = /api/student {
      proxy_pass http://app_backend/student;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Đề kiểm thử curl http://localhost/student/ (không có tiền tố /api)
    location = /student {
      proxy_pass http://app_backend/student;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /student/ {
      proxy_pass http://app_backend/student;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # GET /api/rooms và /api/rooms/:id → App /rooms...
    location /api/rooms {
      proxy_pass http://app_backend/rooms;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

   
    location = /api/me {
      proxy_pass http://app_backend/me;
      proxy_set_header Host $host;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Đề: GET /secure với Bearer token của realm MSSV
    location = /api/secure {
      proxy_pass http://app_backend/secure;
      proxy_set_header Host $host;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /secure {
      proxy_pass http://app_backend/secure;
      proxy_set_header Host $host;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # A2 — POST /api/bookings (JWT bắt buộc; giữ Authorization)
    location = /api/bookings {
      proxy_pass http://app_backend/bookings;
      proxy_set_header Host $host;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

   
    location /minio/ {
      set $minio_upstream http://object-storage-server:9000;
      rewrite ^/minio/(.*)$ /$1 break;
      proxy_pass $minio_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      client_max_body_size 100m;
      proxy_buffering off;
    }

    # 1) Web — Round Robin web-frontend-server và web-frontend-server-2
    location / {
      proxy_pass http://web_frontend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3) Auth — Keycloak (Lợi)
    # Keycloak chạy với --http-relative-path=/auth nên tự serve tại /auth/...
    # Nginx chỉ cần proxy thẳng, không rewrite path.
    location /auth/ {
      set $auth_upstream "http://authentication-identity-server:8080";
      proxy_pass $auth_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
    }
  }
}

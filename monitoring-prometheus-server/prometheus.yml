global:
  scrape_interval: 15s

scrape_configs:
  # 1. Tu giam sat Prometheus
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 2. Giam sat Node Exporter
  - job_name: 'node'
    static_configs:
      - targets: ['monitoring-node-exporter-server:9100']

  # 3. Giam sat Grafana
  - job_name: 'grafana'
    static_configs:
      - targets: ['monitoring-grafana-dashboard-server:3000']

  # 4. Giam sat Loki
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']

  # 5. Giam sat Web Frontend (Nginx /metrics)
  - job_name: 'web'
    metrics_path: /metrics
    static_configs:
      - targets: ['web-frontend-server:80']

  # 6. Giam sat Application Backend (NestJS)
  - job_name: 'application-backend'
    metrics_path: '/metrics'
    static_configs:
      - targets:
          - 'application-backend-server-1:8081'
          - 'application-backend-server-2:8081'

networks:
  cloud-net:
    name: cloud-net
    external: true

services:

  monitoring-node-exporter-server:
    image: prom/node-exporter:latest
    container_name: monitoring-node-exporter-server
    ports:
      - "9100:9100"
    restart: unless-stopped
    networks:
      - cloud-net


  monitoring-prometheus-server:
    build:
      context: ./monitoring-prometheus-server
      dockerfile: Dockerfile
    image: mini-cloud-prometheus:v1
    container_name: monitoring-prometheus-server
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - cloud-net


  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring-grafana-dashboard-server/loki-config.yml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped
    networks:
      - cloud-net

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./monitoring-grafana-dashboard-server/promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    restart: unless-stopped
    networks:
      - cloud-net

  monitoring-grafana-dashboard-server:
    image: grafana/grafana:latest
    container_name: monitoring-grafana-dashboard-server
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./monitoring-grafana-dashboard-server/provisioning:/etc/grafana/provisioning:ro
    restart: unless-stopped
    networks:
      - cloud-net

  redis-cache-server:
    image: redis:7-alpine
    container_name: redis-cache-server
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - cloud-net

  # --- Vân: App × 2 (LB) + Proxy ---
  application-backend-server-1:
    build:
      context: ./application-backend-server
      dockerfile: Dockerfile
    image: minicloud-app:dev
    container_name: application-backend-server-1
    ports:
      - "8085:8081"
    environment:
      - PORT=8081
      - APP_INSTANCE=app-1
      - POSTGRES_HOST=relational-database-server
      - POSTGRES_PORT=5432
      - POSTGRES_USER=minicloud
      - POSTGRES_PASSWORD=minicloud_dev
      - POSTGRES_DB=minicloud
    depends_on:
      relational-database-server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cloud-net

  application-backend-server-2:
    build:
      context: ./application-backend-server
      dockerfile: Dockerfile
    image: minicloud-app:dev
    container_name: application-backend-server-2
    ports:
      - "8086:8081"
    environment:
      - PORT=8081
      - APP_INSTANCE=app-2
      - POSTGRES_HOST=relational-database-server
      - POSTGRES_PORT=5432
      - POSTGRES_USER=minicloud
      - POSTGRES_PASSWORD=minicloud_dev
      - POSTGRES_DB=minicloud
    depends_on:
      relational-database-server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cloud-net

  web-frontend-server:
    build:
      context: ./web-frontend-server
      dockerfile: Dockerfile
    image: myminicloud-web:v1
    container_name: web-frontend-server
    ports:
      - "8080:80"
    restart: unless-stopped
    networks:
      - cloud-net

  # ── Internal DNS Server (Bind9) ── Hân ──────────────────────────────────────
  internal-dns-server:
    build:
      context: ./internal-dns-server
      dockerfile: Dockerfile
    image: myminicloud-dns:v1
    container_name: internal-dns-server
    ports:
      - "1053:53/udp"
      - "1053:53/tcp"
    restart: unless-stopped
    networks:
      - cloud-net

  # ── Lợi: Database (Postgres) + Auth (Keycloak) + MinIO (Object Storage) ────
  relational-database-server:
    image: postgres:16-alpine
    container_name: relational-database-server
    restart: unless-stopped
    environment:
      POSTGRES_DB: minicloud
      POSTGRES_USER: minicloud
      POSTGRES_PASSWORD: minicloud_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./relational-database-server/init:/docker-entrypoint-initdb.d:ro
    networks:
      - cloud-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minicloud -d minicloud"]
      interval: 5s
      timeout: 3s
      retries: 10

  authentication-identity-server:
    image: quay.io/keycloak/keycloak:26.3.3
    container_name: authentication-identity-server
    restart: unless-stopped
    command: ["start-dev", "--http-port=8080", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost/auth}
      KC_HOSTNAME_ADMIN: ${KEYCLOAK_ADMIN_URL:-http://localhost:8082}
      KC_PROXY_HEADERS: xforwarded
    ports:
      - "8082:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./authentication-identity-server/realm:/opt/keycloak/data/import:ro
    networks:
      - cloud-net

  object-storage-server:
    image: minicloud-minio:source-RELEASE.2025-09-07T16-13-09Z
    build:
      context: ./object-storage-server
      dockerfile: Dockerfile
    container_name: object-storage-server
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./object-storage-server/data:/data
    networks:
      - cloud-net

  api-gateway-proxy-server:
    build:
      context: ./api-gateway-proxy-server
      dockerfile: Dockerfile
    image: minicloud-proxy:dev
    container_name: api-gateway-proxy-server
    ports:
      - "80:80"
    depends_on:
      - application-backend-server-1
      - application-backend-server-2
      - web-frontend-server
      - authentication-identity-server
    restart: unless-stopped
    networks:
      - cloud-net

volumes:
  postgres_data:
  keycloak_data:

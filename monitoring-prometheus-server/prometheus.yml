global:
  scrape_interval: 15s

scrape_configs:
  # 1. Tu giam sat Prometheus
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 2. Giam sat Node Exporter
  - job_name: 'node'
    static_configs:
      - targets: ['monitoring-node-exporter-server:9100']

  # 3. Giam sat Grafana
  - job_name: 'grafana'
    static_configs:
      - targets: ['monitoring-grafana-dashboard-server:3000']

  # 4. Giam sat Loki
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
events {}

http {
  # Docker DNS — dùng cho Web/Auth (có thể chưa có container)
  resolver 127.0.0.11 valid=10s ipv6=off;

  # App luôn có trong compose S2 → upstream cố định (strip /api/ đúng cách)
  upstream app_backend {
    server application-backend-server:8081;
  }

  server {
    listen 80;

    # 1) Web (Hân) — stub tạm nếu chưa có React
    location / {
      set $web_upstream http://web-frontend-server:80;
      proxy_pass $web_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2) API — App NestJS (bỏ prefix /api/)
    location /api/ {
      proxy_pass http://app_backend/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3) Auth — Keycloak (Lợi)
    location /auth/ {
      set $auth_upstream http://authentication-identity-server:8080;
      proxy_pass $auth_upstream/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}

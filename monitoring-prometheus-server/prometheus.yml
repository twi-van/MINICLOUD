global:
  scrape_interval: 15s

scrape_configs:
  # 1. Tự giám sát Prometheus
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 2. Giám sát Node Exporter 
  - job_name: 'node'
    static_configs:
      - targets: ['monitoring-node-exporter-server:9100']

  # 3. Giám sát Web & App 
  - job_name: 'web'
    static_configs:
      - targets: ['web-frontend-server:80']
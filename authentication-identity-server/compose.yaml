services:
  authentication-identity-server:
    image: quay.io/keycloak/keycloak:26.3.3
    container_name: authentication-identity-server
    restart: unless-stopped
    command: ["start-dev", "--http-port=8080", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost/auth}
      KC_HOSTNAME_ADMIN: ${KEYCLOAK_ADMIN_URL:-http://localhost:8082}
      KC_PROXY_HEADERS: xforwarded
    # Host 8082 serves Keycloak; NestJS maps host 8085 to container 8081.
    ports:
      - "8082:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./realm:/opt/keycloak/data/import:ro
    networks:
      - cloud-net

volumes:
  keycloak_data:

networks:
  cloud-net:
    name: cloud-net
    external: true
